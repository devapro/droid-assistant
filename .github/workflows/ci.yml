name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push supersedes an in-flight run for the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: Server (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # NFR-PORT-5: Linux x86-64 and macOS arm64 are supported targets, so
        # both are tested rather than assumed.
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install
        run: uv sync --extra dev --extra local

      - name: Lint
        run: |
          uv run ruff check src eval tests
          uv run ruff format --check src eval tests

      - name: Type check
        run: uv run mypy src eval

      - name: Download models needed by the model-bearing tests
        run: uv run droid-assistant models download --no-diarization --asr tiny
        env:
          DROID_DATA_DIR: ./data

      - name: Test
        run: uv run pytest -q --cov=droid_assistant --cov-report=term-missing
        env:
          DROID_DATA_DIR: ./data

  client:
    name: Client
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        working-directory: web
        run: npm ci

      - name: Type check
        working-directory: web
        run: npm run typecheck

      - name: Lint
        working-directory: web
        run: npm run lint

      - name: Build
        working-directory: web
        run: npm run build

      - name: Check the bundle budget
        working-directory: web
        # NFR-RES-6: ≤ 500 KB gzipped, so the page loads quickly on mobile data.
        # Checked here rather than trusted, because bundles only ever grow.
        run: |
          total=$(find ../src/droid_assistant/static/assets -name '*.js' -o -name '*.css' \
            | xargs -I{} sh -c 'gzip -c "$1" | wc -c' _ {} \
            | awk '{s+=$1} END {print s}')
          echo "Bundle: $((total / 1024)) KB gzipped (budget 500 KB)"
          test "$total" -le 512000

  browser:
    name: Browser end-to-end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      # The suite drives a real browser against a real server, so it builds and
      # runs the image the same way an operator would.
      - name: Build and start the stack
        run: |
          docker build -t droid-assistant:latest .
          docker run -d --name droid -p 8000:8000 \
            -e DROID_SERVER__HOST=0.0.0.0 -e DROID_ASR__MODEL=tiny \
            droid-assistant:latest
          docker exec droid droid-assistant models download --asr tiny
          docker restart droid
          for _ in $(seq 1 60); do
            curl -fsS http://localhost:8000/api/health >/dev/null && break || sleep 5
          done

      - name: Install the client and its browser
        working-directory: web
        run: |
          npm ci
          npx playwright install chromium --with-deps

      - name: Test
        working-directory: web
        run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: web/test-results/
          retention-days: 7

      - name: Server logs on failure
        if: failure()
        run: docker logs droid

  security:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      # NFR-SEC-8: dependencies are pinned by the lockfile and scanned here.
      - name: Audit Python dependencies
        run: |
          uv sync --extra dev --extra local --extra cloud
          uv run --with pip-audit pip-audit --strict || true

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Audit client dependencies
        working-directory: web
        run: npm audit --audit-level=high || true

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build the CPU image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
